modLoader="javafml"
loaderVersion="[4,)"
license="MIT"

[[mixins]]
    config="mixins.adaptiveattacks.json"

[[mods]]
    modId="adaptiveattacks"
    version="${mod_version}"
    displayName="Adaptive Attacks"
    authors="MrWizard94"
    description="""
        Adds phase-specific and archetype-driven special attacks to the AdaptiveBoss system.
        Requires Adaptive Boss. Compatible with any boss registered via AdaptiveBossRegistry.
    """

[[dependencies.adaptiveattacks]]
    modId="adaptiveboss"
    type="required"
    versionRange="[1.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.adaptiveattacks]]
    modId="neoforge"
    type="required"
    versionRange="[21.1,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.adaptiveattacks]]
    modId="minecraft"
    type="required"
    versionRange="[1.21.1,1.22)"
    ordering="NONE"
    side="BOTH"
